name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare CleanTV Custom Source Code (Self-Contained)
        run: |
          echo "=== Chuan bi ma nguon CleanTV Custom (Sao luu APK & Go bo) ==="
          rm -rf /tmp/vgs-base /tmp/vgs-base.zip
          curl -sSL "https://github.com/vgscity/vgs-cleantv/archive/1f56a08953233676a6683cc1223c268ae665149c.zip" -o /tmp/vgs-base.zip
          unzip -q /tmp/vgs-base.zip -d /tmp/vgs-extract
          mv /tmp/vgs-extract/vgs-cleantv-* /tmp/vgs-base
          cp -rf /tmp/vgs-base/. .

          echo "" > /tmp/patch.b64

          python3 - << 'EOF_PY'
          import base64, gzip, json, os

          with open("/tmp/patch.b64", "rb") as f:
              raw = base64.b64decode(f.read().strip())
          patch = json.loads(gzip.decompress(raw).decode("utf-8"))

          orig_root = "/tmp/vgs-base"
          for rel_path, entry in patch.items():
              os.makedirs(os.path.dirname(rel_path) or ".", exist_ok=True)
              if "full" in entry and entry["full"] is not None:
                  out_text = entry["full"]
              else:
                  with open(os.path.join(orig_root, rel_path), "r", encoding="utf-8") as of:
                      o_lines = of.read().replace("\r\n", "\n").split("\n")
                  parts = []
                  for op in entry["ops"]:
                      if isinstance(op, str):
                          parts.append(op)
                      else:
                          s, c = int(op[0]), int(op[1])
                          parts.append("\n".join(o_lines[s:s+c]))
                  out_text = "\n".join(parts)
              with open(rel_path, "w", encoding="utf-8", newline="\n") as mf:
                  mf.write(out_text)
              print(f"Applied custom file: {rel_path} ({len(out_text)} chars)")
          EOF_PY

          grep -q "batDauXoaCoSaoLuu" app/src/main/java/zone/vgs/tvsach/ui/PhienLamViec.kt
          echo "=== Da tich hop 100% ma nguon Sao luu APK & Go bo thanh cong! ==="

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Accept Android SDK Licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          elif [ -n "$ANDROID_SDK_ROOT" ] && [ -f "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Build Debug APK with Gradle
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CleanTV-Custom-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
